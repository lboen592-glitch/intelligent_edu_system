<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>智学助教系统 - 首页</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.8/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
        nav { background: #333; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: white; margin-right: 15px; text-decoration: none; font-size: 14px; }
        nav a:hover { text-decoration: underline; }
        .container { padding: 20px; max-width: 1000px; margin: 0 auto; }
        .card-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .card { background: white; padding: 15px; border: 1px solid #ddd; flex: 1; min-width: 200px; }
        .chart-container { background: white; padding: 20px; border: 1px solid #ddd; margin-bottom: 20px; height: 300px; }
        .logout-btn { background: #ff4d4f; color: white; border: none; padding: 5px 10px; cursor: pointer; }
    </style>
    <script>
        const token = localStorage.getItem("token");
        if (!token) { location.href = "login.html"; }
        const api = axios.create({ baseURL: "http://localhost:8080", timeout: 10000 });
        api.interceptors.request.use((config) => {
            const t = localStorage.getItem("token");
            if (t) config.headers.Authorization = "Bearer " + t;
            return config;
        });
    </script>
</head>
<body>

<div id="app">
    <nav>
        <div>
            <strong>智学助教</strong>
            <a href="index.html">首页</a>
            <a href="ai-chat.html">AI问答</a>
            <a href="question-bank.html">题库管理</a>
            <a href="practice.html">刷题练习</a>
            <a href="knowledge.html">知识库</a>
        </div>
        <div>
            <span>{{ userName }}</span>
            <a href="profile.html" style="margin-left:15px;">个人信息</a>
            <button class="logout-btn" @click="logout">退出登录</button>
        </div>
    </nav>

    <div class="container">
        <h2>欢迎回来，{{ userName }}</h2>
        <p>今天是：{{ currentDate }}</p>

        <div class="card-row">
            <div class="card" v-for="item in statsCards">
                <div style="color: #666; font-size: 12px;">{{ item.title }}</div>
                <div style="font-size: 20px; font-weight: bold; margin: 5px 0;">{{ item.value }}</div>
                <div style="font-size: 12px; color: blue;">{{ item.trendText }}</div>
            </div>
        </div>

        <div style="display: flex; gap: 20px; flex-wrap: wrap;">
            <div class="chart-container" style="flex: 2;">
                <strong>学习进度统计</strong>
                <canvas id="study-chart"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    const { createApp } = Vue;

    createApp({
        data() {
            return {
                userName: localStorage.getItem("username") || "用户",
                currentDate: new Date().toLocaleDateString(),
                statsCards: [],
                recommendations: [],
                chartInstance: null
            };
        },
        methods: {
            async fetchDataToShow() {
                try {
                    const res = await api.get('/api/index/data_show');
                    const d = res.data;
                    if (d.success || d.code === 200) {
                        this.statsCards = [
                            { title: '已完成题目', value: d.totalQuesNum },
                            { title: '正确率', value: (d.accuracy * 100).toFixed(1) + '%'},
                            { title: '错题数量', value: d.wrongQuesNum},
                            { title: '学习时长', value: (d.totalStudyTime / 60).toFixed(1) + 'h'}
                        ];
                        this.initStudyChart(d.weekDataList || []);
                    }
                } catch (e) {
                    alert('获取统计数据失败');
                }
            },
            initStudyChart(weekData) {
                const labels = weekData.map(d => d.date).reverse();
                const quesNums = weekData.map(d => d.totalQuesNum).reverse();
                const ctx = document.getElementById('study-chart').getContext('2d');
                if (this.chartInstance) this.chartInstance.destroy();
                this.chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{ label: '刷题数', data: quesNums, borderColor: 'blue', fill: false }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            },
            logout() {
                if (confirm('确定退出吗？')) {
                    localStorage.clear();
                    location.href = 'login.html';
                }
            },
            goToResource(url) { window.open(url, '_blank'); }
        },
        mounted() {
            this.fetchDataToShow();
        }
    }).mount('#app');
</script>
</body>
</html>
