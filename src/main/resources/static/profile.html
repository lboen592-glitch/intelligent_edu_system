<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>题目数据管理系统 - 个人信息</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.8/dist/axios.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f4f4f4; font-size: 14px; }
        nav { background: #333; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: white; text-decoration: none; margin-right: 15px; }
        .container { padding: 20px; max-width: 800px; margin: 0 auto; display: flex; gap: 20px; }

        .section { background: white; padding: 20px; border: 1px solid #ddd; margin-bottom: 20px; }
        .sidebar { width: 220px; }
        .main-info { flex: 1; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="password"], textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; }
        input:disabled, textarea:disabled { background: #eee; cursor: not-allowed; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .modal { background: white; padding: 20px; width: 350px; border-radius: 5px; }

        button { padding: 6px 12px; cursor: pointer; border: 1px solid #ccc; background: #fff; margin-top: 5px; }
        .btn-primary { background: #007bff; color: white; border: none; }
        .btn-success { background: #28a745; color: white; border: none; }
    </style>
</head>
<body>

<div id="app">
    <nav>
        <div>
            <strong>题目数据管理系统</strong>
            <a href="index.html">返回首页</a>
        </div>
        <div>
            <span>{{ userInfo.username }}</span>
            <button @click="logout" style="margin-left:10px;">退出</button>
        </div>
    </nav>

    <div class="container">
        <div class="sidebar">
            <div class="section" style="text-align: center;">
                <p style="color: #666; margin-bottom: 5px;">总学习时长</p>
                <strong style="color:#007bff; font-size:20px;">{{ formatStudyTime(userInfo.totalStudyTime) }}</strong>
            </div>
            <div class="section">
                <button style="width: 100%" @click="showPasswordDialog = true">修改账户密码</button>
            </div>
        </div>

        <div class="main-info">
            <div class="section">
                <h3 style="margin-top:0;">基本信息</h3>
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" v-model="userInfo.username" disabled>
                </div>
                <div class="form-group">
                    <label>真实姓名</label>
                    <input type="text" v-model="userInfo.fullname" :disabled="!isEditing">
                </div>
                <div class="form-group">
                    <label>性别</label>
                    <input type="radio" value="1" v-model="userInfo.gender" :disabled="!isEditing"> 男
                    <input type="radio" value="2" v-model="userInfo.gender" :disabled="!isEditing"> 女
                    <input type="radio" value="0" v-model="userInfo.gender" :disabled="!isEditing"> 保密
                </div>
                <div class="form-group">
                    <label>个人简介</label>
                    <textarea v-model="userInfo.profile" rows="5" :disabled="!isEditing" placeholder="向大家介绍一下自己吧..."></textarea>
                </div>

                <div style="text-align: right; margin-top: 20px;">
                    <button v-if="!isEditing" class="btn-primary" @click="isEditing = true">编辑个人资料</button>
                    <template v-else>
                        <button @click="cancelEdit">取消</button>
                        <button class="btn-success" @click="saveInfo">保存修改</button>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <div v-if="showPasswordDialog" class="overlay">
        <div class="modal">
            <h3 style="margin-top:0;">修改密码</h3>
            <div class="form-group">
                <label>旧密码</label>
                <input type="password" v-model="passwordForm.oldPassword">
            </div>
            <div class="form-group">
                <label>新密码</label>
                <input type="password" v-model="passwordForm.newPassword">
            </div>
            <div class="form-group">
                <label>确认新密码</label>
                <input type="password" v-model="passwordForm.confirmPassword">
            </div>
            <div style="text-align:right; margin-top: 20px;">
                <button @click="showPasswordDialog = false">取消</button>
                <button class="btn-primary" @click="savePassword">确认修改</button>
            </div>
        </div>
    </div>
</div>

<script>
    const { createApp } = Vue;

    const api = axios.create({
        baseURL: "http://localhost:8080",
        timeout: 10000
    });
    api.interceptors.request.use(config => {
        const userId = localStorage.getItem("userId");
        if (userId) {
            config.headers["X-User-Id"] = userId;
        }
        return config;
    });
    const userId = localStorage.getItem("userId");
    if (!userId) location.href = "login.html";


    createApp({
        data() {
            return {
                userInfo: { username: "", fullname: "", gender: 0, profile: "", totalStudyTime: 0 },
                isEditing: false,
                showPasswordDialog: false,
                passwordForm: { oldPassword: "", newPassword: "", confirmPassword: "" },
                originalUserInfo: {}
            };
        },
        methods: {
            async loadUserInfo() {
                try {
                    const res = await api.get("/api/profile");
                    if (res.data.success) {
                        this.userInfo = res.data.data;
                        this.originalUserInfo = { ...this.userInfo };
                    }
                } catch (e) {
                    console.error("加载用户信息失败");
                }
            },
            formatStudyTime(m) {
                if (!m) return "0分";
                return m > 60 ? `${Math.floor(m/60)}小时${m%60}分` : `${m}分`;
            },
            async saveInfo() {
                try {
                    const res = await api.put("/api/profile", this.userInfo);
                    if (res.data.success) {
                        this.isEditing = false;
                        this.originalUserInfo = { ...this.userInfo };
                        alert("已更新");
                    }
                } catch (e) { alert("更新失败"); }
            },
            cancelEdit() {
                this.userInfo = { ...this.originalUserInfo };
                this.isEditing = false;
            },
            async savePassword() {
                if (!this.passwordForm.newPassword) return alert("新密码不能为空");
                if (this.passwordForm.newPassword !== this.passwordForm.confirmPassword) {
                    return alert("两次输入的新密码不一致");
                }
                try {
                    const res = await api.put("/api/profile/update-password", this.passwordForm);
                    if (res.data.success) {
                        alert("密码修改成功");
                        this.showPasswordDialog = false;
                        this.passwordForm = { oldPassword: "", newPassword: "", confirmPassword: "" };
                    } else {
                        alert(res.data.message);
                    }
                } catch (e) { alert("修改失败"); }
            },
            logout() {
                localStorage.clear();
                location.href = "login.html";
            }
        },
        mounted() {
            this.loadUserInfo();
        }
    }).mount("#app");
</script>
</body>
</html>
