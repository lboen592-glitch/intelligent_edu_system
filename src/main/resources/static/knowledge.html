<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>智学助教 - 知识库</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.8/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@13.0.1/dist/markdown-it.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f4f4f4; font-size: 14px; }
        nav { background: #333; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: white; text-decoration: none; margin-right: 15px; }
        .container { padding: 20px; max-width: 900px; margin: 0 auto; }

        .section { background: white; padding: 15px; border: 1px solid #ddd; margin-bottom: 20px; }
        .note-item { border-bottom: 1px solid #eee; padding: 10px 0; display: flex; justify-content: space-between; }

        /* 简易弹窗 */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .modal { background: white; padding: 20px; width: 90%; max-width: 700px; max-height: 80vh; overflow-y: auto; border-radius: 4px; }

        /* 按钮与输入 */
        button { padding: 5px 10px; cursor: pointer; border: 1px solid #ccc; background: #fff; }
        .btn-primary { background: #007bff; color: white; border: none; }
        .btn-danger { background: #dc3545; color: white; border: none; }
        input[type="text"], textarea { width: 100%; padding: 8px; box-sizing: border-box; margin-bottom: 10px; }

        /* 进度条 */
        .progress-bar { height: 8px; background: #eee; border-radius: 4px; margin: 10px 0; }
        .progress-inner { height: 100%; background: #28a745; border-radius: 4px; transition: width 0.3s; }

        /* Markdown 内容区域预览样式 */
        .markdown-view { border: 1px solid #eee; padding: 15px; background: #fafafa; min-height: 200px; }
    </style>
</head>
<body>

<div id="app">
    <nav>
        <div>
            <strong>智学助教</strong>
            <a href="index.html">首页</a>
            <a href="ai-chat.html">AI问答</a>
            <a href="question-bank.html">题库管理</a>
            <a href="practice.html">刷题练习</a>
            <a href="knowledge.html">知识库</a>
        </div>
        <div>
            <span>{{ userName }}</span>
            <button @click="logout" style="margin-left:10px;">退出</button>
        </div>
    </nav>

    <div class="container">
        <div class="section">
            <h3>PPT 智能解析</h3>
            <p style="color: #666;">上传 PPT 自动生成结构化笔记</p>
            <input type="file" ref="pptInput" accept=".ppt,.pptx" @change="handlePptUpload">
            <div v-if="uploading">
                <div class="progress-bar"><div class="progress-inner" :style="{width: uploadProgress + '%'}"></div></div>
                <small>{{ uploadStatus }} ({{ uploadProgress }}%)</small>
            </div>
        </div>

        <div class="section">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3>我的笔记</h3>
                <button class="btn-primary" @click="createNewNote">+ 新建笔记</button>
            </div>
            <div v-if="notes.length === 0" style="color:#999; padding: 20px; text-align: center;">暂无笔记</div>
            <div v-for="note in notes" :key="note.id" class="note-item">
                <div>
                    <strong>{{ note.noteName || '未命名笔记' }}</strong><br>
                    <small style="color:#999">{{ note.creatTime }}</small>
                </div>
                <div>
                    <button @click="openNote(note)">查看/编辑</button>
                    <button class="btn-danger" @click="deleteNote(note)">删除</button>
                </div>
            </div>
        </div>
    </div>

    <div v-if="showModal" class="overlay">
        <div class="modal">
            <div style="display:flex; justify-content: space-between; margin-bottom: 10px;">
                <strong>笔记详情</strong>
                <button @click="showModal = false">关闭</button>
            </div>

            <input type="text" v-model="currentNote.noteName" placeholder="笔记标题" :disabled="!isEditing">

            <div v-if="isEditing">
                <textarea v-model="currentNote.noteContent" rows="15" placeholder="支持 Markdown 语法..."></textarea>
                <div style="text-align: right;">
                    <button class="btn-primary" @click="saveNote">保存笔记</button>
                    <button @click="isEditing = false">返回预览</button>
                </div>
            </div>

            <div v-else>
                <div class="markdown-view" v-html="renderMD(currentNote.noteContent)"></div>
                <div style="text-align: right; margin-top: 10px;">
                    <button class="btn-primary" @click="isEditing = true">编辑内容</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const { createApp } = Vue;
    const md = window.markdownit();

    // Axios 基础配置
    const api = axios.create({ baseURL: "http://localhost:8080" });
    api.interceptors.request.use(config => {
        const t = localStorage.getItem("token");
        if (t) config.headers.Authorization = "Bearer " + t;
        return config;
    });

    createApp({
        data() {
            return {
                userName: localStorage.getItem("username") || "用户",
                notes: [],
                // PPT 上传
                uploading: false,
                uploadProgress: 0,
                uploadStatus: "",
                // 笔记弹窗
                showModal: false,
                isEditing: false,
                currentNote: {}
            }
        },
        methods: {
            renderMD(text) { return md.render(text || "无内容"); },

            async loadNotes() {
                const res = await api.get('/api/knowledge/list');
                this.notes = res.data.data || [];
            },

            // 1. PPT 上传逻辑
            async handlePptUpload(e) {
                const file = e.target.files[0];
                if (!file) return;

                const formData = new FormData();
                formData.append('file', file);
                this.uploading = true;
                this.uploadProgress = 0;
                this.uploadStatus = "正在上传...";

                try {
                    const res = await api.post('/api/knowledge/upload-ppt', formData);
                    if (res.data.success) {
                        this.pollProgress(res.data.data.taskId);
                    }
                } catch (err) {
                    alert("上传失败");
                    this.uploading = false;
                }
            },

            // 轮询 PPT 解析进度
            pollProgress(taskId) {
                const timer = setInterval(async () => {
                    const res = await api.get(`/api/knowledge/upload-ppt/progress/${taskId}`);
                    const data = res.data.data;
                    this.uploadProgress = data.progress;
                    this.uploadStatus = data.message;

                    if (data.status === 'DONE') {
                        clearInterval(timer);
                        this.uploading = false;
                        alert("解析成功！");
                        this.loadNotes();
                    } else if (data.status === 'ERROR') {
                        clearInterval(timer);
                        this.uploading = false;
                        alert("解析失败: " + data.message);
                    }
                }, 1000);
            },

            // 2. 笔记管理逻辑
            async createNewNote() {
                const res = await api.post('/api/knowledge/create');
                if (res.data.success) {
                    this.openNote(res.data.data);
                    this.isEditing = true;
                    this.loadNotes();
                }
            },

            openNote(note) {
                this.currentNote = JSON.parse(JSON.stringify(note));
                this.isEditing = false;
                this.showModal = true;
            },

            async saveNote() {
                const res = await api.put('/api/knowledge/update', {
                    id: this.currentNote.id,
                    noteName: this.currentNote.noteName,
                    noteContent: this.currentNote.noteContent
                });
                if (res.data.success) {
                    alert("已保存");
                    this.isEditing = false;
                    this.loadNotes();
                }
            },

            async deleteNote(note) {
                if (!confirm("确定删除笔记吗？")) return;
                await api.delete(`/api/knowledge/delete/${note.id}`);
                this.loadNotes();
            },

            logout() {
                localStorage.clear();
                location.href = "login.html";
            }
        },
        mounted() {
            this.loadNotes();
        }
    }).mount('#app');
</script>
</body>
</html>
