<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>智学助教 - AI问答</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.8/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@13.0.1/dist/markdown-it.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f4f4f4; }
        /* 导航栏 */
        nav { background: #333; color: white; padding: 10px 20px; display: flex; justify-content: space-between; }
        nav a { color: white; text-decoration: none; margin-right: 15px; font-size: 14px; }
        /* 布局 */
        .main-container { display: flex; gap: 20px; padding: 20px; height: 80vh; }
        .chat-section { flex: 2; background: white; border: 1px solid #ddd; display: flex; flex-direction: column; }
        .search-section { flex: 1; background: white; border: 1px solid #ddd; padding: 10px; overflow-y: auto; }
        /* 聊天框 */
        #chat-window { flex: 1; padding: 15px; overflow-y: auto; border-bottom: 1px solid #eee; }
        .msg { margin-bottom: 15px; padding: 10px; border-radius: 5px; }
        .ai-msg { background: #eef5ff; border-left: 4px solid #409EFF; }
        .user-msg { background: #f0f0f0; border-right: 4px solid #666; text-align: right; }
        .thought-box { font-size: 12px; color: #888; border: 1px dashed #ccc; padding: 5px; margin-bottom: 5px; }
        /* 输入区 */
        .input-area { padding: 10px; display: flex; gap: 10px; }
        textarea { flex: 1; height: 50px; padding: 5px; }
        /* 搜索列表 */
        .res-item { padding: 8px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 13px; }
        .res-item:hover { background: #f9f9f9; }
    </style>
</head>
<body>

<div id="app">
    <nav>
        <div>
            <strong>智学助教</strong>
            <a href="index.html">首页</a>
            <a href="ai-chat.html">AI问答</a>
            <a href="question-bank.html">题库管理</a>
            <a href="practice.html">刷题练习</a>
            <a href="knowledge.html">知识库</a>
        </div>
        <div>
            <span>{{ userName }}</span>
            <button @click="logout" style="margin-left:10px;">退出</button>
        </div>
    </nav>

    <div class="main-container">
        <div class="chat-section">
            <div style="padding: 10px; background: #eee;">与 AI 助教对话</div>
            <div id="chat-window" ref="chatWin">
                <div v-for="msg in chatMessages" :class="['msg', msg.isUser ? 'user-msg' : 'ai-msg']">
                    <div v-if="msg.thought" class="thought-box">
                        <strong>思考过程：</strong>
                        <div v-html="renderMD(msg.thought)"></div>
                    </div>
                    <div v-html="msg.isUser ? msg.content : renderMD(msg.content)"></div>
                </div>
                <div v-if="isLoading" style="color: #999;">AI 正在思考中...</div>
            </div>
            <div class="input-area">
                <textarea v-model="userInput" placeholder="输入问题，回车发送" @keyup.enter.exact="sendMessage"></textarea>
                <button @click="sendMessage">发送</button>
            </div>
        </div>
    </div>
</div>

<script>
    const { createApp } = Vue;
    const md = window.markdownit(); // 基础 Markdown 渲染器

    createApp({
        data() {
            return {
                userName: localStorage.getItem("username") || "用户",
                chatMessages: [{ content: "你好！有什么我可以帮你的？", isUser: false }],
                userInput: "",
                isLoading: false,
                searchQuery: "",
                searchResults: [],
                isSearching: false
            };
        },
        methods: {
            renderMD(text) { return md.render(text || ""); },

            // 流式发送消息
            async sendMessage() {
                if (!this.userInput.trim() || this.isLoading) return;
                const userText = this.userInput;
                this.chatMessages.push({ content: userText, isUser: true });
                this.userInput = "";
                this.isLoading = true;
                try {
                    const token = localStorage.getItem("token");
                    const response = await fetch("http://localhost:8080/api/ai-chat/chat-stream", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": token ? "Bearer " + token : ""
                        },
                        body: JSON.stringify({ prompt: userText })
                    });

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let aiRawText = "";
                    // 先在数组里占个位给 AI 的回复
                    this.chatMessages.push({ content: "", thought: "", isUser: false });
                    let aiMsg = this.chatMessages[this.chatMessages.length - 1];
                    this.isLoading = false;
                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        aiRawText += decoder.decode(value);
                        // 处理 <think> 标签逻辑
                        const thinkMatch = aiRawText.match(/<think>([\s\S]*?)(?:<\/think>|$)([\s\S]*)/);
                        if (thinkMatch) {
                            aiMsg.thought = thinkMatch[1];
                            aiMsg.content = thinkMatch[2];
                        } else {
                            aiMsg.content = aiRawText;
                        }
                        this.scrollToBottom();
                    }
                } catch (e) {
                    alert("AI 连接失败");
                    this.isLoading = false;
                }
            },

            scrollToBottom() {
                this.$nextTick(() => {
                    const win = this.$refs.chatWin;
                    win.scrollTop = win.scrollHeight;
                });
            },
            logout() {
                localStorage.clear();
                location.href = "login.html";
            },
            goToResource(url) { window.open(url, '_blank'); }
        }
    }).mount('#app');
</script>

</body>
</html>
