spring.application.name=demo_system


# Spring Security
spring.security.user.name=admin
spring.security.user.password=123456
spring.security.user.roles=USER,ADMIN

# MySQL

spring.datasource.url=jdbc:mysql://localhost:3306/system_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=685685
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.demo_system.entity
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# Ollama
ollama.url=http://localhost:11434/api/generate
ollama.model=deepseek-r1:8b

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB